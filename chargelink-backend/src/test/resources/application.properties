# Database Configuration (H2 for Tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable Flyway for Unit Tests
spring.flyway.enabled=false

# Supabase Properties (Dummy values for tests)
supabase.url=https://placeholder-project-id.supabase.co
supabase.anon.key=placeholder-anon-key
supabase.service.role.key=placeholder-service-role-key

# App Specific Secrets (Resolved from env in prod, dummy in test)
DB_PASSWORD=dummy
SUPABASE_PROJECT_ID=placeholder-project-id
SUPABASE_ANON_KEY=placeholder-anon-key
SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key

# JWT Security
jwt.secret=placeholder-very-long-and-secure-jwt-secret-key-32-chars-plus
