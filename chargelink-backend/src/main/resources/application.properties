spring.application.name=chargelink-backend

# Database Configuration (Supabase)
# Database Configuration (Supabase Pooler for IPv4 Support)
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?user=postgres.uxnfoivctwgwgzjslisl&password=${DB_PASSWORD}
spring.datasource.username=postgres.uxnfoivctwgwgzjslisl
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security - JWKS endpoint auto-handles ES256/RS256 key types
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://${SUPABASE_PROJECT_ID}.supabase.co/auth/v1/.well-known/jwks.json

#Supa
supabase.url=https://${SUPABASE_PROJECT_ID}.supabase.co
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY}

# Temporary debug logging - remove before production
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

spring.task.scheduling.enabled=true