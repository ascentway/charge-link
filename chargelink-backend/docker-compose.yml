
services:
  backend:
    container_name: chargelink-backend
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: docker

      # Database
      SPRING_DATASOURCE_URL: "jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?user=postgres.uxnfoivctwgwgzjslisl&password=${DB_PASSWORD}"
      SPRING_DATASOURCE_USERNAME: "postgres.uxnfoivctwgwgzjslisl"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"

      # Supabase
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "https://${SUPABASE_PROJECT_ID}.supabase.co/auth/v1/.well-known/jwks.json"
      SUPABASE_URL: "https://${SUPABASE_PROJECT_ID}.supabase.co"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"

      # 🔥 Redis Cache (IMPORTANT)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_started

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # ==============================
  # Redis Cache
  # ==============================
  redis:
    image: redis:7.2
    container_name: chargelink-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped

  # ==============================
  # RedisInsight GUI
  # ==============================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: chargelink-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-cache-data: